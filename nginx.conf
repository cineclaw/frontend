server {
    listen 3000;
    server_name _;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Security & PWA Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Service Worker & Manifest: Never cache aggressively
    location ~* (sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Static Assets: Long cache
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Internal Auth Verification Subrequest
    location = /api/auth/verify {
        internal;
        proxy_pass http://tracker-proxy:9118/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Public Auth endpoints (login, logout, me)
    location ~ ^/api/auth/(login|logout|me)$ {
        proxy_pass http://tracker-proxy:9118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected Proxy to CineClaw AI Engine (port 9120)
    location ~ ^/api/ai/(.*)$ {
        auth_request /api/auth/verify;
        error_page 401 = @error401;

        proxy_pass http://cineclaw-ai:9120/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Protected Proxy to IMDb Indexer (port 8090)
    location ~ ^/(search|poster|status|api|series)(/|$) {
        auth_request /api/auth/verify;
        error_page 401 = @error401;

        proxy_pass http://imdb-indexer:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Protected Proxy to Tracker Proxy (port 9118)
    location ~ ^/(torrents|api/stream)(/|$) {
        auth_request /api/auth/verify;
        error_page 401 = @error401;

        proxy_pass http://tracker-proxy:9118;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location @error401 {
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"Authentication required"}';
    }

    # SPA / PWA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
