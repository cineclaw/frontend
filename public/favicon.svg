<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="40%" stop-color="#0c101a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Metallic Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="35%" stop-color="#f5c518"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Claw Slash Core Gradient -->
    <linearGradient id="clawGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f5c518"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Film Frame Accent Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f5c518" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe885" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Amber Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Horizontal Anamorphic Lens Flare -->
    <radialGradient id="flareGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#f5c518" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#f5c518" flood-opacity="0.5" result="color"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#goldBorder)" stroke-width="10"/>

  <!-- Subtle Ambient Core Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Cinema Reel / Aperture Outer Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#222d42" stroke-width="6" stroke-opacity="0.55"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#frameGrad)" stroke-width="6" stroke-dasharray="24 16" stroke-linecap="round" opacity="0.65"/>

  <!-- Stylized Film Strip Perforations Top & Bottom -->
  <g fill="#f5c518" fill-opacity="0.35">
    <!-- Top row perforations -->
    <rect x="166" y="90" width="16" height="24" rx="4"/>
    <rect x="206" y="90" width="16" height="24" rx="4"/>
    <rect x="246" y="90" width="16" height="24" rx="4"/>
    <rect x="286" y="90" width="16" height="24" rx="4"/>
    <rect x="326" y="90" width="16" height="24" rx="4"/>

    <!-- Bottom row perforations -->
    <rect x="166" y="398" width="16" height="24" rx="4"/>
    <rect x="206" y="398" width="16" height="24" rx="4"/>
    <rect x="246" y="398" width="16" height="24" rx="4"/>
    <rect x="286" y="398" width="16" height="24" rx="4"/>
    <rect x="326" y="398" width="16" height="24" rx="4"/>
  </g>

  <!-- Anamorphic Cinema Lens Flare Horizon -->
  <ellipse cx="256" cy="256" rx="200" ry="4" fill="url(#flareGrad)" opacity="0.85"/>

  <!-- Claw Slashes Group with Glowing Filter -->
  <g filter="url(#goldGlowFilter)">
    <!-- Claw 1 (Left slash - fast taper, curved aggression) -->
    <path d="M 162 136
             C 188 200, 194 280, 154 374
             C 174 340, 198 266, 186 150
             C 180 142, 170 138, 162 136 Z"
          fill="url(#clawGrad)"/>

    <!-- Claw 2 (Center slash - massive, dominant, piercing) -->
    <path d="M 252 104
             C 286 195, 296 300, 240 416
             C 268 370, 304 275, 282 120
             C 274 110, 262 106, 252 104 Z"
          fill="url(#clawGrad)"/>

    <!-- Claw 3 (Right slash - balanced curve, sharp blade) -->
    <path d="M 342 144
             C 370 205, 376 285, 334 374
             C 354 340, 380 268, 368 158
             C 360 150, 350 146, 342 144 Z"
          fill="url(#clawGrad)"/>

    <!-- Claw Highlights: Razor-Sharp Hot White Spine -->
    <path d="M 172 152 C 185 210, 187 270, 163 346 C 172 320, 188 255, 180 156 Z"
          fill="#ffffff" opacity="0.75"/>
    <path d="M 264 122 C 280 208, 288 290, 250 388 C 265 348, 290 262, 274 132 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M 352 160 C 365 215, 369 274, 343 348 C 352 320, 370 258, 360 164 Z"
          fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Central Star Sparkle Overlay -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#intenseGlow)"/>
    <ellipse cx="0" cy="0" rx="36" ry="2.5" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="2.5" ry="36" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
